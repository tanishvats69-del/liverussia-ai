<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE RUSSIA AI Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 450px;
            height: 600px;
            background-color: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #333;
        }
        .chat-header {
            background-color: #cf3a24;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #1e70bf;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #2a2a2a;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #444;
        }
        .chat-input-area {
            display: flex;
            padding: 12px;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            gap: 8px;
        }
        .chat-input {
            flex: 1;
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }
        .chat-input:focus {
            border-color: #cf3a24;
        }
        .send-btn {
            background-color: #cf3a24;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .send-btn:hover {
            background-color: #b52f1c;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">LIVE RUSSIA Forum AI</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message ai-message">Hello! Ask me any question about the LIVE RUSSIA forum rules, GPS locations, or faction structures.</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" class="chat-input" placeholder="Ask about rule 1.09 or Church GPS..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        appendMessage(text, 'user-message');

        // Create temporary dots bubble while waiting
        const botMessageDiv = appendMessage('...', 'ai-message');

        try {
            const response = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: text })
            });
            
            const data = await response.json();
            
            // FIXED: Looks for 'response' or 'error' variables cleanly matching python output
            if (data.response) {
                botMessageDiv.innerText = data.response;
            } else if (data.error) {
                botMessageDiv.innerText = "Error: " + data.error;
            } else {
                botMessageDiv.innerText = "Error: Invalid response format from server.";
            }
        } catch (error) {
            botMessageDiv.innerText = "Error connecting to the AI server. Please try again.";
        }
    }

    function appendMessage(text, className) {
        const container = document.getElementById('chatMessages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
        return msgDiv;
    }
</script>

</body>
</html>
